<div             ><b>Task:</b>reconstruct the triangle by points $A$, $B$ and $H$</div>
<div class="flex"><b>Given:</b><div class="flex-col">
  <div>$A$, $B$ - two vertices of the triangle</div>
  <div>$H$ - point of intersection of heights of the triangle</div>
</div></div>
<div class="flex-col" id="solution-steps" task-name="ABH" initial-command=
    "A=(2,1)\nB=(0,-1)\nH=(0,0)
    AH=If(Dot(H-A,B-A)<0,Ray(H,A),Dot(A-H,B-H)<0,Ray(A,H),Ray((1e9,1e9),(1e10,1e10)))
    AH0=If(Dot(H-A,B-A)>0&&Dot(A-H,B-H)>0,Segment(A,H),Segment(A,A))
    BH=If(Dot(H-B,A-B)<0,Ray(H,B),Dot(B-H,A-H)<0,Ray(B,H),Ray((1e9,1e9),(1e10,1e10)))
    BH0=If(Dot(H-B,A-B)>0&&Dot(B-H,A-H)>0,Segment(B,H),Segment(B,B))
    B_1=Intersect(PerpendicularLine(A,Line(B,H)),Line(B,H))
    A_1=Intersect(PerpendicularLine(B,Line(A,H)),Line(A,H))
    C=Intersect(Line(A,B_1),Line(B,A_1))
    AB_1=If(Dot(H-A,B-A)<0,Ray(B_1,A),Dot(A-H,B-H)<0||Dot(H-B,A-B)<0,Ray(A,B_1),Ray((1e9,1e9),(1e10,1e10)))
    AB_1s=If(Dot(C-A,B_1-A)>0&&Dot(A-B_1,C-B_1)>0,Segment(A,B_1),Segment(A,A))
    BA_1=If(Dot(H-B,A-B)<0,Ray(A_1,B),Dot(B-H,A-H)<0||Dot(H-A,B-A)<0,Ray(B,A_1),Ray((1e9,1e9),(1e10,1e10)))
    BA_1s=If(Dot(C-B,A_1-B)>0&&Dot(B-A_1,C-A_1)>0,Segment(B,A_1),Segment(B,B))
    ABC=Polygon(A,B,C)">
  <div objs="AH BH AH0 BH0"                 >1. $AH$ and $BH$</div>
  <div objs="AB_1 AB_1s BA_1 BA_1s A_1 B_1" >2. $AB_1⊥BH$ and $BA_1⊥AH$</div>
  <div objs="C"                             >3. $C=AB_1⋂BA_1$</div>
  <div objs="ABC"                           >4. $ΔABC$</div>
</div>
